:root{
  --encre:#3b3b3d;
  --terracotta:#a2603c;
  --sable:#f6f0ea;
  --blanc:#ffffff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  background:var(--sable);
  color:var(--encre);
  font-family:"Montserrat","Avenir Next","Helvetica Neue",Arial,sans-serif;
  font-size:17px;
  line-height:1.6;
}
.bandeau{height:8px;background:linear-gradient(90deg,var(--terracotta),#c9a58c)}
main{
  max-width:600px;
  margin:0 auto;
  padding:40px 24px 56px;
  text-align:center;
}
.logo{
  display:block;
  width:min(260px,72vw);
  height:auto;
  margin:0 auto 34px;
}
.carte{
  background:var(--blanc);
  border-radius:6px;
  padding:36px 28px 32px;
  box-shadow:0 1px 3px rgba(59,59,61,.12);
}
.coche{
  width:56px;height:56px;
  margin:0 auto 18px;
  display:block;
}
h1{
  margin:0 0 20px;
  font-size:1.65rem;
  font-weight:600;
  line-height:1.25;
}
p{margin:0 0 14px}
.fermer{
  margin:18px 0 0;
  font-size:.85rem;
  color:#6b6b6e;
}
.signature{
  margin-top:24px;
  padding-top:22px;
  border-top:1px solid #e6dcd2;
}
.signature .mot{margin-bottom:6px}
.signature .nom{
  margin:0;
  font-size:.8rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--terracotta);
  font-weight:600;
}
@media (max-width:480px){
  body{font-size:16px}
  main{padding:28px 16px 40px}
  .carte{padding:28px 20px 26px}
  h1{font-size:1.4rem}
}
</style>
